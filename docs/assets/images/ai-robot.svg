<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot head -->
  <rect x="150" y="50" width="100" height="100" rx="20" fill="#7B78C7" />
  <!-- Eyes -->
  <circle cx="180" cy="90" r="15" fill="#00C28A" />
  <circle cx="220" cy="90" r="15" fill="#00C28A" />
  <!-- Antenna -->
  <line x1="200" y1="50" x2="200" y2="20" stroke="#5755A1" stroke-width="8" />
  <circle cx="200" cy="15" r="8" fill="#00C28A" />
  <!-- Body -->
  <rect x="160" y="160" width="80" height="100" rx="10" fill="#5755A1" />
  <!-- Arms -->
  <rect x="100" y="180" width="60" height="20" rx="10" fill="#7B78C7" />
  <rect x="240" y="180" width="60" height="20" rx="10" fill="#7B78C7" />
</svg> 