title: Learn Agentic AI
description: Your guide to understanding and building autonomous AI systems
baseurl: "/learn-agentic-ai-with-me"
url: "https://lucyvers.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  blog:
    output: true
    permalink: /blog/:name/
  news:
    output: true
    permalink: /news/:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - blog.md
  - news.md

# Theme settings (navigation is handled in _layouts/default.html)
minima:
  date_format: "%Y-%m-%d"

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default