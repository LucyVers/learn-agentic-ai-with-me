title: Learn Agentic AI with Me
description: A comprehensive resource for learning about Agentic AI - exploring autonomous AI agents and their applications
baseurl: "/learn-agentic-ai-with-me"  # the subpath of your site
url: "https://lucyvers.github.io"  # your GitHub username

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Theme settings
minima:
  date_format: "%Y-%m-%d"
  header_pages:
    - about.md
    - blog/index.md
    - news/index.md

# Collections
collections:
  news:
    output: true
    permalink: /news/:path/
  blog:
    output: true
    permalink: /blog/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: news
  - scope:
      path: ""
      type: "blog"
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default 