title: Learn Agentic AI
description: Your guide to understanding and building autonomous AI systems
baseurl: "/learn-ai-with-me"
url: "https://lucyvers.github.io"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Theme settings
minima:
  date_format: "%Y-%m-%d"
  header_pages:
    - about.md
    - blog/index.md
    - news/index.md

# Collections
collections:
  news:
    output: true
    permalink: /news/:path/
  blog:
    output: true
    permalink: /blog/:path/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default 